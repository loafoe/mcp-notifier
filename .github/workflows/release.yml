name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  KO_DOCKER_REPO: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # required for keyless cosign signing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Ko
        uses: ko-build/setup-ko@v0.9

      - name: Setup Cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (main)
        if: github.ref == 'refs/heads/main'
        id: build-main
        run: |
          DIGEST=$(ko build --bare --platform=linux/amd64,linux/arm64 --tags latest,main-${{ github.sha }} ./cmd/mcp-notifier)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Build and push (tag)
        if: startsWith(github.ref, 'refs/tags/')
        id: build-tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          DIGEST=$(ko build --bare --platform=linux/amd64,linux/arm64 --tags "${VERSION}",latest ./cmd/mcp-notifier)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign image (main)
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes ${{ steps.build-main.outputs.digest }}

      - name: Sign image (tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: cosign sign --yes ${{ steps.build-tag.outputs.digest }}
